# sdl-dos-ports candidate backlog and status tracker.
#
# Each port lives in its own git repository. This file is the queue: a
# candidate starts at dos_status BACKLOG with no port_repo_url. Claiming a
# candidate means running scripts/new-port.sh, which scaffolds the new
# port's repo (wired to this repo's shared/ via git submodule), and then
# updating that candidate's entry here (dos_status -> RESEARCH,
# port_repo_url set) in a commit to this repo.
#
# dos_status ladder:
#   BACKLOG -> RESEARCH -> BLOCKED -> BOOTSTRAP -> COMPILES -> STARTS ->
#   TITLE_SCREEN -> PLAYABLE -> FULL_GAME -> OPTIMIZING -> RELEASE_READY
#
# difficulty: 1 = trivial, 2 = easy, 3 = moderate, 4 = difficult,
#             5 = major engine-port effort
#
# Never guess an upstream_url. If a candidate's upstream is not yet located,
# leave upstream_url null and say so in notes -- locating and pinning the
# canonical upstream revision is that candidate's literal first task.
#
# upstream_license / upstream_license_verified: same rule applies to
# licensing as to upstream_url -- NEVER GUESS. upstream_license_verified is
# only true once someone has actually read the upstream project's own
# LICENSE/COPYING file (or equivalent) in the pinned revision and recorded
# what it says. A "commonly believed to be X" recollection is not
# verification -- leave upstream_license null and put the lead in notes
# instead. We need this to be right because it governs what we are legally
# allowed to distribute, modify, and how (see docs/licensing.md and
# CLAUDE.md's "Never contribute upstream" section for the related policy on
# not sending anything back to these upstreams).

