    upstream_license_verified: true
    port_repo_url: https://github.com/ecliptik/doskutsu
    language: C++
    original_sdl_version: "2 (via nxengine-evo)"
    target_sdl_version: "3"
    graphics_api: software / VESA
    dos_status: RELEASE_READY
    priority: 0
    difficulty: null
    dos_minimum_target: 486DX2-66
    dos_recommended_target: Pentium 75
    maintainer: ecliptik
    notes: >
      Reference port. Cave Story via NXEngine-evo (GPLv3) on
      SDL3/DJGPP/CWSDPMI. Source of the shared/ platform layer.
      shared/ submodule adoption (plans/DOSKUTSU-MIGRATION-PLAN.md)
      LANDED on doskutsu main, currently at 332d379 (pin bump from
      f00dd84 to pick up the hub's shared/skills/; pushed to Forgejo
      origin). Submodule (.sdl-dos-ports) pinned at sdl-dos-ports
      006a02c75a3cd8279a735b34084fbd94cff99596. Steps 1-4 landed:
      patches/SDL + patches/SDL_mixer symlinked into
      shared/patches/sdl3-dos + sdl3-mixer, the 4 vendor scripts
      symlinked into shared/scripts/, and the SDL3/mixer/image build
      stages consumed via shared/build/sdl3-dos.mk. Build-correctness
      verified: verify-patches-applied 114+2 patches exit 0 through
      the symlinks, make all exit 0 (rebuilt binary byte-identical to
      a from-scratch build on the same host), make smoke gate PASS,
      and a real-hardware RUNMANIFEST run (g2k rig) confirmed
      environment=realhw + build_sha12=04388290f735. Performance
      confirmed separately post-migration: a real-hardware ABBA
      reproduction of patch 0328's (BG blank-tile-skip) measured KPI
      on the POD-83/Mach64/PicoGUS rig came back PASS, delta +3.15fps
      vs. the pre-migration baseline of +3.0fps (threshold >=+2.0,
      A-to-A spread 0.0) -- the submodule migration changed neither
      build output nor measured performance. Steps 5-7 (tools/ DOSBox-X
      confs, tests/probes, .claude/agents/ charters) deliberately left
      doskutsu-local for now, per the plan's own recommendation --
      keeping tools/ local sidesteps the DOSKUTSU_ENVIRONMENT vs.
      DOS_PORT_ENVIRONMENT env-var mismatch rather than resolving it.
      upstream_revision per vendor/sources.manifest in the doskutsu
      repo as of this writing; re-check there for the current pin.
      upstream_license verified directly against doskutsu's own
      LICENSE file ("NOTE ON COMBINED BINARY" section) as of this
      writing.

  - name: adventure-game-studio
    upstream_url: https://github.com/adventuregamestudio/ags
    upstream_revision: 94e271df9c14484d89f4861100f643d39555dae7
    upstream_license: Artistic License 2.0
    upstream_license_verified: true
    port_repo_url: null
    language: C++
    original_sdl_version: "2"
    target_sdl_version: "3"
    graphics_api: software
    dos_status: BACKLOG
    priority: 1
    difficulty: 5
    dos_minimum_target: null
    dos_recommended_target: null
    maintainer: null
    notes: >
      Highest strategic value: one engine port potentially unlocks a large
      catalog of games. Needs an explicit SDL2->SDL3 strategy decision
      (direct port vs. compatibility shim) before kickoff -- see
      plans/SDL_DOS_PORTING_PROGRAM.md section 18. First deliverables are
      research-only (RESEARCH.md, SDL-SURFACE.md, DEPENDENCIES.md,
      PLATFORM-SURFACE.md, LICENSE-REVIEW.md, PLAN.md). Port name chosen:
      dosags (repo to be created at forgejo.ecliptik.com/ecliptik/dosags).

      2026-09-10: upstream_revision pinned to tag v3.6.3.13 (94e271df9),
      the current tip of the actively-maintained `ags3` stable branch
      (dated 2026-08-16) -- deliberately not the newer `ags4` line, which
      has far less mileage and its own parallel version history; `ags3`
      continues the long-established 3.x series the large majority of
      existing AGS games target. upstream_license verified by reading
      this revision's own License.txt + Copyright.txt directly: Artistic
      License 2.0, original author Chris Jones, various contributors
      2011-2026. Note: the AGSBlend plugin (Plugins/agsblend/) carries its
      own separate license file -- irrelevant unless that plugin is ever
      whitelisted in under the AGS-DOS compatibility profile.

      Dependency shape at this pin (read from CMakeLists.txt): C++11
      throughout, SDL2 + SDL2_sound required (fetched via CMake
      FetchContent by default -- moot for us, DJGPP needs its own
      hand-written Makefile regardless, per doskutsu precedent), Ogg +
      Vorbis + Theora all `REQUIRED` at the CMake level. Theora already
      has a first-class `AGS_NO_VIDEO_PLAYER` build option (matches the
      compatibility profile's "Theora: unsupported initially" directly --
      no patching needed to strip it). Ogg/Vorbis have no equivalent
      toggle yet, so whether an initial DJGPP build can exclude them is an
      open Milestone-0 question. "Allegro" appears in ~150-240 source
      files but only as legacy internal class/file naming (AllegroBitmap,
      wgt2allg, etc.) inherited from AGS's early history -- there is no
      `find_package(Allegro)` or link target in the current build, so this
      is not a real external dependency to port.

