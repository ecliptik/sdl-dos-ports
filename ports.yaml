    upstream_url: https://github.com/nxengine/nxengine-evo
    upstream_revision: 1f093d1423cc395eb199230cd609b806ef1daa36
    upstream_license: GPL-3.0
    upstream_license_verified: true
    port_repo_url: https://github.com/ecliptik/doskutsu
    language: C++
    original_sdl_version: "2 (via nxengine-evo)"
    target_sdl_version: "3"
    graphics_api: software / VESA
    dos_status: RELEASE_READY
    priority: 0
    difficulty: null
    dos_minimum_target: 486DX2-66
    dos_recommended_target: Pentium 75
    maintainer: ecliptik
    notes: >
      Reference port. Cave Story via NXEngine-evo (GPLv3) on
      SDL3/DJGPP/CWSDPMI. Source of the shared/ platform layer. Not
      currently pointed at shared/ via submodule -- migration tracked in
      plans/META-REPO-PLAN.md step 5. upstream_revision per
      vendor/sources.manifest in the doskutsu repo as of this writing;
      re-check there for the current pin. upstream_license verified
      directly against doskutsu's own LICENSE file ("NOTE ON COMBINED
      BINARY" section) as of this writing.

